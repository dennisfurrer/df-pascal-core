[workspace]
resolver = "3"
members = ["packages/core"]

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
rust-version = "1.94"
license = "BUSL-1.1"
authors = ["Dennis Furrer"]
homepage = "https://dfurrer.com"
readme = "README.md"
keywords = ["pascal", "solana", "prediction-markets", "trading", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies", "wasm"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zeroize = "1.9.0"
# Program derived addresses: SHA-256 of the seeds, then a check that the point is off the curve.
sha2 = { version = "0.10.9", default-features = false }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }
# Ed25519 for trading keys and the owner wallet.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std", "zeroize", "fast"] }
# Randomness for new trading keys. The js feature is required on wasm32.
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }

reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }

# Pinned exactly to match the wasm-bindgen CLI and test runner.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
wasm-bindgen-test = "=0.3.79"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# Prices and sizes are exact decimals.
float_arithmetic = "deny"
# A panic crashes a Worker isolate or the browser app.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "warn"
